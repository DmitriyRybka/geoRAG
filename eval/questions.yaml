# Вопросы для оценки. Эталонный набор ID вычисляет код (eval/run_eval.py) по этим параметрам:
#   задан radius_m -> все места category (и cuisine) в радиусе от landmark;
#   задан k        -> k ближайших мест category (и cuisine) к landmark;
#   иначе          -> все места category и cuisine во всей выгрузке (вопрос по атрибуту).
# Параметры выбраны до запуска систем и после просмотра результатов не менялись.

# --- в радиусе ---
- id: r1
  type: radius
  text: Найди кафе в 500 метрах от Летнего сада
  category: cafe
  landmark: Летний сад
  radius_m: 500
- id: r2
